<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="Explore procedural mathematical curves and their sound. Copy a seed to recreate the same equation, pattern, and sound in your browser.">
  <title>Sonograph</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M5 16q4-18 8 0t8 0 6 0' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css?v=20261017">
  <script src="engine.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="equations.js" defer></script>
  <script src="playground.js" defer></script>
  <script src="cartoon.js" defer></script>
  <script src="shapes.js" defer></script>
  <script src="machines.js?v=20261007-final" defer></script>
  <script src="machines-view.js" defer></script>
  <script src="songs.js?v=20261008-final" defer></script>
  <script src="performances.js?v=20261008-light" defer></script>
  <script src="performances-view.js?v=20261008-light" defer></script>
  <script src="kinetic-scores.js?v=20261008-final" defer></script>
  <script src="curve-play.js?v=20261008-final" defer></script>
  <script src="continuous-curves.js?v=20261008-final" defer></script>
  <script src="tunes.js?v=20261017" defer></script>
  <script src="sound.js?v=20261017-bytebeat" defer></script>
  <script src="player.js?v=20261017-ui" defer></script>
  <script src="machine-controls.js" defer></script>
  <script src="library.js?v=20261017" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="library" id="library" aria-label="Pattern library">
      <div class="library-head">
        <a class="brand" href="./" aria-label="Sonograph home"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16q4-18 8 0t8 0 6 0"/></svg></span><span>Sonograph</span></a>
        <button id="close-library" class="icon-button library-close" type="button" aria-label="Close library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span class="sr-only">Search patterns</span><input id="library-search" type="search" placeholder="Search patterns" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
      <nav id="library-list" class="library-list" aria-label="Patterns"></nav>
      <p id="library-empty" class="library-empty" hidden>No matching patterns.</p>
      <div class="library-foot"><span id="library-count">191 patterns</span><a href="https://github.com/Prit36/Sonograph" target="_blank" rel="noopener noreferrer">GitHub</a></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button id="open-library" class="button secondary" type="button" aria-controls="library" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Browse</button>
        <a class="brand" href="./" aria-label="Sonograph home"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16q4-18 8 0t8 0 6 0"/></svg></span><span>Sonograph</span></a>
      </header>

      <section class="title-row" aria-labelledby="pattern-name">
        <div class="title-text"><p class="eyebrow" id="pattern-group">Number tunes</p><h1 id="pattern-name">Recamán's leaps</h1></div>
        <button id="next" class="button secondary" type="button" aria-label="Next pattern" title="Next pattern (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 4 4-4 4M4 7h16M8 13l-4 4 4 4m12-4H4"/></svg><span class="button-label">Next pattern</span><kbd>N</kbd></button>
      </section>

      <div class="workspace">
      <section class="stage" aria-label="Pattern player">
        <div class="plot-shell"><canvas id="plot" role="img" aria-label="Graph of the generated mathematical function"></canvas><span id="domain-label" class="domain-label">0 ≤ x ≤ 16</span></div>
        <div id="machine-controls" class="machine-controls" aria-label="Machine controls" hidden></div>
        <div class="transport">
          <button id="play" class="play-button" type="button" aria-label="Play sound" title="Play (Space)"><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg><span id="play-label" class="sr-only">Play sound</span></button>
          <button id="restart" class="icon-button" type="button" aria-label="Restart pattern" title="Restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
          <span class="time" id="time">0:00 <span>/ 0:07</span></span>
          <div class="progress-track" id="progress-track" role="slider" tabindex="0" aria-label="Playback position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div>
          <label class="volume" title="Volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 5H2v4h3l6 5ZM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="100" value="35" aria-label="Volume"><output id="volume-value" class="sr-only">35%</output></label>
        </div>
      </section>

      <section class="equation-mini" aria-label="Equation"><div class="equation" id="equation-mini" aria-hidden="true"></div><button id="open-details" class="button secondary" type="button" aria-controls="details" aria-expanded="false">Details</button></section>

      <aside class="side" id="details" aria-label="Pattern details">
        <div class="sheet-head"><span>Details</span><button id="close-details" class="icon-button" type="button" aria-label="Close details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <article class="panel equation-panel" aria-labelledby="equation-title">
          <h2 class="panel-title" id="equation-title">Equation</h2>
          <div class="equation" id="equation" aria-label="Generated equation"></div>
          <div id="pattern-info" class="pattern-notes">
            <button id="toggle-description" class="disclosure" type="button" aria-expanded="false" aria-controls="pattern-definitions"><span>Show description</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <p id="pattern-definitions"></p>
            <div class="pattern-meta"><span id="pattern-voice" class="voice-tag"></span><a id="pattern-reference" target="_blank" rel="noopener noreferrer">Reference<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div>
          </div>
        </article>
        <article class="panel settings-panel" aria-labelledby="settings-title">
          <h2 class="panel-title" id="settings-title">Playback</h2>
          <div class="field-row">
          <div class="field"><label for="sound-mode">Sound</label><select id="sound-mode" data-segmented><option value="vivid">Vivid</option><option value="original">Original</option></select></div>
          <div class="field"><label for="scan-duration">Length</label><select id="scan-duration" data-segmented><option value="7">7 s</option><option value="14">14 s</option></select></div>
          </div>
          <form class="field seed-form" id="seed-form">
            <label for="seed">Seed</label>
            <div class="seed-row"><div class="seed-input"><input id="seed" name="seed" type="text" autocomplete="off" spellcheck="false" maxlength="128"><button id="copy" class="icon-button" type="button" aria-label="Copy seed" title="Copy seed"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button></div><button class="button secondary load-seed" type="submit" title="Load seed">Load</button></div>
          </form>
        </article>
      </aside>
      </div>
    </main>
  </div>
  <p id="status" class="toast" role="status" aria-live="polite" hidden></p>
</body>
</html>
